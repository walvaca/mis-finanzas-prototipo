<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; connect-src 'self';">
<meta name="theme-color" content="#0d1421">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mis Finanzas · Prototipo</title>
<style>
:root{
  --bg:#0d1421; --bg2:#141d2e; --card:#1a2537; --card2:#22304a; --border:#2c3d5c;
  --text:#e8eef7; --muted:#8fa3c0; --accent:#2f81f7; --accent2:#1f6feb;
  --green:#3fb950; --yellow:#d29922; --red:#f85149;
  --radius:18px; --nav:68px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#070b13;color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{position:relative;width:100%;max-width:480px;height:100%;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:520px){.app{height:min(100%,900px);margin:auto;border-radius:28px;border:1px solid var(--border);box-shadow:0 30px 80px #000a}}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.6px}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--card);border:1px solid var(--border);display:grid;place-items:center}
main{flex:1;overflow-y:auto;padding:6px 18px calc(var(--nav) + 26px);scrollbar-width:none}
main::-webkit-scrollbar{display:none}
h2{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.8px;text-transform:uppercase;margin:22px 0 10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.semaforo{display:flex;gap:14px;align-items:center;border-width:1.5px}
.semaforo .luz{flex:0 0 64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:800;color:#07101d}
.semaforo.verde{border-color:var(--green);background:linear-gradient(135deg,#12301d,var(--card) 70%)}
.semaforo.amarillo{border-color:var(--yellow);background:linear-gradient(135deg,#33290f,var(--card) 70%)}
.semaforo.rojo{border-color:var(--red);background:linear-gradient(135deg,#3a1517,var(--card) 70%)}
.verde .luz{background:var(--green)}.amarillo .luz{background:var(--yellow)}.rojo .luz{background:var(--red)}
.semaforo h1{font-size:22px;line-height:1.15}
.semaforo p{color:var(--muted);font-size:14px;margin-top:3px}
.motivos{margin-top:10px;display:grid;gap:8px}
.motivo{display:flex;gap:10px;align-items:flex-start;font-size:14px;background:var(--bg2);border-radius:12px;padding:10px 12px;border:1px solid var(--border)}
.dot{flex:0 0 10px;height:10px;border-radius:50%;margin-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px}
.stat span{display:block;color:var(--muted);font-size:12px;font-weight:600}
.stat b{display:block;font-size:20px;margin-top:4px;font-variant-numeric:tabular-nums}
.stat.big{grid-column:1/-1;background:linear-gradient(135deg,var(--accent2),#173a78);border-color:transparent}
.stat.big span{color:#cfe0ff}.stat.big b{font-size:30px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:0}
.row .ic{flex:0 0 40px;height:40px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-size:19px}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx small{color:var(--muted);font-size:12.5px}
.row .am{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.neg{color:var(--text)}.pos{color:var(--green)}
.anulado .tx b,.anulado .am{text-decoration:line-through;color:var(--muted)}
.btn{background:var(--accent);color:#fff;font-weight:700;border-radius:12px;padding:9px 14px;font-size:14px}
.btn.big{display:block;width:100%;padding:16px;font-size:17px;border-radius:16px;margin-top:14px}
.btn.ghost{background:var(--card2);border:1px solid var(--border)}
.tag{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px}
.tag.red{background:#4a1c1f;color:#ff9a95}.tag.yel{background:#3d3010;color:#f0c35a}.tag.grn{background:#143a1f;color:#7fdc8f}
.tabs{display:flex;gap:6px;background:var(--bg2);padding:4px;border-radius:14px;border:1px solid var(--border)}
.tabs button{flex:1;padding:9px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--card2);color:var(--text)}
nav{position:absolute;left:0;right:0;bottom:0;height:var(--nav);background:#0f1829ee;backdrop-filter:blur(14px);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;padding:0 6px env(safe-area-inset-bottom)}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 10px;min-width:58px}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--accent)}
nav .plus{width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;margin-top:-26px;box-shadow:0 8px 24px #2f81f766;border:4px solid var(--bg);min-width:0;padding:0}
.sheet{position:absolute;inset:0;background:var(--bg);z-index:5;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s ease;padding:14px 18px 20px}
.sheet.open{transform:none}
.monto{font-size:46px;font-weight:800;text-align:center;margin:10px 0 4px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{padding:10px 14px;border-radius:14px;background:var(--card);border:1px solid var(--border);font-size:14.5px}
.chip.on{background:var(--accent);border-color:var(--accent);font-weight:700}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:auto}
.keys button{padding:15px 0;border-radius:14px;background:var(--card);border:1px solid var(--border);font-size:22px;font-weight:600}
select,input[type=text]{width:100%;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:11px;font:inherit}
.seg{display:flex;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:4px}
.seg button{flex:1;padding:9px;border-radius:10px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--card2);color:var(--text)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu button{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;text-align:left}
.menu button span{display:block;font-size:24px;margin-bottom:6px}
.menu button b{font-weight:600}
.toast{position:absolute;left:18px;right:18px;bottom:calc(var(--nav) + 14px);background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:9;opacity:0;pointer-events:none;transform:translateY(10px);transition:.2s}
.toast.show{opacity:1;pointer-events:auto;transform:none}
.toast button{color:var(--accent);font-weight:700}
.hide .am,.hide .stat b,.hide .monto-oculto{filter:blur(8px)}
.banner{font-size:12px;text-align:center;color:var(--muted);padding:8px 18px;background:var(--bg2);border-bottom:1px solid var(--border)}
.bar{height:8px;border-radius:99px;background:var(--bg2);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.warn{background:var(--yellow)}
.view{display:none}.view.on{display:block}
.lock{position:absolute;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:12px;text-align:center}
.lock.off{display:none}
.lock h1{font-size:26px}.lock p{color:var(--muted);font-size:14px}
.dots{display:flex;gap:14px;margin:6px 0}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}.dots i.on{background:var(--accent);border-color:var(--accent)}
.lock .keys{width:100%;max-width:320px;margin-top:6px}
.lock .msg{min-height:20px;color:var(--yellow);font-size:13.5px}
details{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:0 14px;margin-bottom:8px}
details summary{padding:14px 0;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
details summary::after{content:"+";color:var(--accent);font-size:20px;line-height:1}
details[open] summary::after{content:"−"}
details p{padding:0 0 14px;color:var(--muted);font-size:14.5px}
textarea{width:100%;min-height:96px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:11px;font:inherit;resize:vertical}
.scroll{flex:1;overflow-y:auto;margin-top:10px}
.chipst{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;margin-bottom:6px}
.chipst.ya{background:#143a1f;color:#7fdc8f}.chipst.demo{background:#12294d;color:#8ab8ff}.chipst.real{background:#3d3010;color:#f0c35a}
.seg-i{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:8px}
.seg-i b{display:block;margin-bottom:3px}.seg-i p{color:var(--muted);font-size:14px}
pre.rep{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px;font:12px/1.45 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word;color:var(--muted);max-height:190px;overflow:auto}
.contacto{display:flex;flex-direction:column;gap:4px;font-size:14.5px}
.contacto a{color:var(--accent);text-decoration:none;font-weight:600}
.licchip{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 14px;margin:2px 0 12px;border-radius:14px;background:#12294d;border:1px solid #2a4a85;font-size:14px;font-weight:600}
.licchip span:nth-child(2){flex:1}
.licchip.amar{background:#33290f;border-color:var(--yellow)}
.licchip.rojo{background:#3a1517;border-color:var(--red)}
.licchip b{color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="banner" id="banner"></div>
  <header>
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4c9bff"/><stop offset="1" stop-color="#1f6feb"/></linearGradient></defs><path d="M32 4 56 14v18c0 14-10 24-24 28C18 56 8 46 8 32V14z" fill="url(#g)"/><path d="M20 38l8-8 6 6 11-13" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div>Mis Finanzas<small>TSI</small></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="iconbtn" id="ayudaBtn" aria-label="Ayuda" style="font-weight:800;font-size:18px">?</button>
      <button class="iconbtn" id="eye" aria-label="Ocultar cifras">👁</button>
    </div>
  </header>
  <main id="main">
    <section class="view on" id="v-inicio"></section>
    <section class="view" id="v-movs"></section>
    <section class="view" id="v-pagos"></section>
    <section class="view" id="v-mas"></section>
  </main>
  <nav id="nav">
    <button data-v="inicio" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-t="nav_inicio"></span></button>
    <button data-v="movs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span data-t="nav_movs"></span></button>
    <button class="plus" id="plus" aria-label="Registrar"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button data-v="pagos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/></svg><span data-t="nav_pagos"></span></button>
    <button data-v="mas"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg><span data-t="nav_mas"></span></button>
  </nav>

  <div class="sheet" id="sheet">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <button class="iconbtn" id="cerrar" aria-label="Cerrar">✕</button>
      <div class="seg" style="width:78%" id="tipo"></div>
    </div>
    <div class="monto" id="monto">0</div>
    <div class="chips" id="cats"></div>
    <div style="margin-top:12px"><select id="cuenta"></select></div>
    <div style="margin-top:8px"><input type="text" id="nota" maxlength="60"></div>
    <div class="keys" id="keys"></div>
    <button class="btn big" id="guardar"></button>
  </div>
  <div class="sheet" id="ayuda">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <button class="iconbtn" id="cerrarAyuda" aria-label="Cerrar">✕</button>
      <b id="ayudaTitulo" style="font-size:18px"></b><span style="width:42px"></span>
    </div>
    <div class="scroll" id="ayudaCuerpo"></div>
  </div>
  <div class="sheet" id="soporte">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <button class="iconbtn" data-cerrar="1" aria-label="Cerrar">✕</button>
      <b id="sopTitulo" style="font-size:18px"></b><span style="width:42px"></span>
    </div>
    <div class="scroll" id="sopCuerpo"></div>
  </div>
  <div class="sheet" id="seguridad">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <button class="iconbtn" data-cerrar="1" aria-label="Cerrar">✕</button>
      <b id="segTitulo" style="font-size:18px"></b><span style="width:42px"></span>
    </div>
    <div class="scroll" id="segCuerpo"></div>
  </div>
  <div class="sheet" id="licencia">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <button class="iconbtn" data-cerrar="1" aria-label="Cerrar">✕</button>
      <b id="licTitulo" style="font-size:18px"></b><span style="width:42px"></span>
    </div>
    <div class="scroll" id="licCuerpo"></div>
  </div>
  <div class="lock" id="lock">
    <svg width="72" height="72" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 4 56 14v18c0 14-10 24-24 28C18 56 8 46 8 32V14z" fill="url(#g)"/><path d="M20 38l8-8 6 6 11-13" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1>Mis Finanzas</h1>
    <p id="lockSub"></p>
    <button class="btn big" id="huella" style="max-width:320px"></button>
    <p id="lockO"></p>
    <div class="dots" id="pindots"></div>
    <div class="msg" id="lockMsg" role="status"></div>
    <div class="keys" id="lockKeys"></div>
    <p id="lockDemo" style="font-size:12.5px"></p>
  </div>
  <div class="toast" id="toast"><span id="toastmsg"></span><button id="toastbtn"></button></div>
</div>

<script>
"use strict";
/* ===== Textos en dos idiomas (en la app real vivirán en archivos de idioma) ===== */
const T = {
 es:{banner:"PROTOTIPO · datos inventados · lo que registres no se guarda",nav_inicio:"Inicio",nav_movs:"Movimientos",nav_pagos:"Pagos",nav_mas:"Más",

  com_t:"¿Algo no se entiende?",com_ph:"Escribe aquí lo que no entendiste o lo que cambiarías",com_btn:"Copiar mis comentarios",com_ok:"Copiado. Pégalo en un mensaje y envíalo a quien te dio la app",com_aviso:"No escribas datos personales ni cifras reales.",com_no:"Escribe algo primero",

  sop_donde:"¿Dónde pasó?",sop_lugares:["Inicio","Registrar","Movimientos","Pagos","Más","Bloqueo o huella","Otro"],

];
const SALDO_INICIAL=1300000, PRESUPUESTO={Comida:500000}; let hide=false, nextId=100, ultimo=null;
const $=(s)=>document.querySelector(s);
const cop=(n)=>new Intl.NumberFormat(lang==="es"?"es-CO":"en-US",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(n);
const esc=(s)=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const diff=(d)=>Math.round((d-day(0))/86400000);
const cuando=(d)=>{const n=diff(d);return n===0?t().hoy_l:n===1?t().manana:n===-1?t().ayer:n<0?t().hace(-n):t().en(n)};
const activos=()=>movs.filter(m=>!m.anulado);

/* ===== Reglas del semáforo (función pura: entran datos, sale resultado) ===== */
function semaforo(){
  const motivos=[]; let nivel="verde";
  const sube=(n)=>{ if(n==="rojo") nivel="rojo"; else if(n==="amarillo"&&nivel!=="rojo") nivel="amarillo"; };
  pagos.filter(p=>!p.pagado&&diff(p.f)<0).forEach(p=>{sube("rojo");motivos.push({c:"rojo",x:t().m_vencido(p.nombre)})});
  const ing=activos().filter(m=>m.tipo==="ingreso").reduce((a,m)=>a+m.monto,0);
  const gas=activos().filter(m=>m.tipo==="gasto"&&m.cat!=="Ahorro").reduce((a,m)=>a+m.monto,0);
  if(gas>ing){sube("rojo");motivos.push({c:"rojo",x:t().m_gasto})}
  pagos.filter(p=>!p.pagado&&diff(p.f)>=0&&diff(p.f)<=2).forEach(p=>{sube("amarillo");motivos.push({c:"amarillo",x:t().m_prox(p.nombre,cuando(p.f))})});
  Object.entries(PRESUPUESTO).forEach(([c,lim])=>{const u=activos().filter(m=>m.tipo==="gasto"&&m.cat===c).reduce((a,m)=>a+m.monto,0);const p=Math.round(u/lim*100);if(p>=80){sube("amarillo");motivos.push({c:"amarillo",x:t().m_pres(t().cats[c],p)})}});
  if(!motivos.length) motivos.push({c:"verde",x:t().m_ok});
  return {nivel,motivos};
}
function resumenHoy(){
  const h=activos().filter(m=>diff(m.f)===0);
  const entro=h.filter(m=>m.tipo==="ingreso").reduce((a,m)=>a+m.monto,0);
  const gast=h.filter(m=>m.tipo==="gasto"&&m.cat!=="Ahorro").reduce((a,m)=>a+m.monto,0);
  const aho=h.filter(m=>m.cat==="Ahorro").reduce((a,m)=>a+m.monto,0);
  const total=SALDO_INICIAL+activos().reduce((a,m)=>a+(m.tipo==="ingreso"?m.monto:-m.monto),0);
  return {entro,gast,aho,total};
}
const COL={verde:"var(--green)",amarillo:"var(--yellow)",rojo:"var(--red)"}, SIM={verde:"✓",amarillo:"!",rojo:"✕"};

/* ===== Pantallas ===== */
function rInicio(){

}
function filaPago(p){
  const n=diff(p.f), tag=p.pagado?`<span class="tag grn">${t().pagado}</span>`:n<0?`<span class="tag red">${t().vencido}</span>`:n<=2?`<span class="tag yel">${cuando(p.f)}</span>`:`<small>${cuando(p.f)}</small>`;
  return `<div class="row"><div class="ic">${p.ic}</div><div class="tx"><b>${esc(p.nombre)}</b><small>${tag}</small></div><div class="am">${cop(p.monto)}</div>${p.pagado?"":`<button class="btn" data-pagar="${p.id}">${t().pagar}</button>`}</div>`;
}
function rMovs(){
  const orden=[...movs].sort((a,b)=>b.f-a.f||b.id-a.id); let html=`<p style="color:var(--muted);font-size:13px;margin:6px 0 4px">${t().anular}</p>`, ult=null;
  orden.forEach(m=>{
    const k=m.f.toDateString();
    if(k!==ult){ult=k;html+=`<h2>${m.f.toLocaleDateString(lang==="es"?"es-CO":"en-US",{weekday:"long",day:"numeric",month:"long"})}</h2>`}
    html+=`<div class="card" style="padding:0 14px;margin-bottom:8px"><div class="row ${m.anulado?"anulado":""}" data-mov="${m.id}"><div class="ic">${ICON[m.cat]||"📦"}</div><div class="tx"><b>${esc(m.nota||t().cats[m.cat])}</b><small>${t().cats[m.cat]} · ${esc(m.cuenta)}</small></div><div class="am ${m.tipo==="ingreso"?"pos":"neg"}">${m.tipo==="ingreso"?"+":"−"}${cop(m.monto)}</div></div></div>`;
  });
  $("#v-movs").innerHTML=html;
}

/* ===== Bloqueo con huella y PIN (demostración) ===== */
const PIN_DEMO="1234"; let lockOn=true, pin="";
const b64=(u)=>btoa(String.fromCharCode(...u)), deb64=(s)=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function pintaLock(){$("#pindots").innerHTML=[0,1,2,3].map(i=>`<i class="${i<pin.length?"on":""}"></i>`).join("")}
function msgLock(m){$("#lockMsg").textContent=m||""}
function bloquear(){if(!lockOn){aviso(t().bloqueado_off);return}pin="";msgLock("");pintaLock();$("#lock").classList.remove("off")}
function desbloquear(){pin="";msgLock("");$("#lock").classList.add("off")}
$("#lockKeys").innerHTML=["1","2","3","4","5","6","7","8","9","","0","⌫"].map(k=>k?`<button data-lk="${k}">${k}</button>`:`<span></span>`).join("");
$("#lockKeys").addEventListener("click",e=>{
  const k=e.target.closest("[data-lk]");if(!k)return;const v=k.dataset.lk;msgLock("");
  pin=v==="⌫"?pin.slice(0,-1):(pin+v).slice(0,4);pintaLock();
  if(pin.length===4){ if(pin===PIN_DEMO){desbloquear()}else{$("#pindots").animate([{transform:"translateX(-8px)"},{transform:"translateX(8px)"},{transform:"none"}],{duration:220});pin="";setTimeout(pintaLock,220);msgLock(t().lock_mal)} }
});
// Huella real del celular (WebAuthn). Si no se puede, queda el PIN de prueba.
async function huella(){
  try{
    if(!window.PublicKeyCredential||!(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()))throw new Error("sin huella");
    const ch=crypto.getRandomValues(new Uint8Array(32)); let id=null;
    try{id=localStorage.getItem("mf_cred")}catch(_){}
    if(!id){
      const c=await navigator.credentials.create({publicKey:{challenge:ch,rp:{name:"Mis Finanzas (prototipo)"},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:"demo",displayName:"Demo"},pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required"},timeout:60000}});
      try{localStorage.setItem("mf_cred",b64(new Uint8Array(c.rawId)))}catch(_){}
    }else{
      await navigator.credentials.get({publicKey:{challenge:ch,allowCredentials:[{type:"public-key",id:deb64(id)}],userVerification:"required",timeout:60000}});
    }
    desbloquear();
  }catch(_){msgLock(t().lock_sinhuella)}
}
$("#huella").addEventListener("click",huella);
document.addEventListener("visibilitychange",()=>{if(document.hidden&&lockOn)bloquear()});

/* ===== Licencia y periodo de prueba (simulado) =====
   Regla: el día de activación es el día 1; el día 30 es el último y vence a las 11:59 p. m. (hora de Colombia).
   Al vencer: solo lectura (ver, exportar y respaldar; no registrar). */
const DIAS_PRUEBA=30; let simDia=1, licPlena=false;
function estadoLic(){
  if(licPlena)return {tipo:"licencia",solo:false};
  const quedan=DIAS_PRUEBA-simDia+1; // cuenta el día de hoy
  return quedan<=0?{tipo:"vencida",solo:true,quedan:0}:{tipo:"prueba",solo:false,quedan};
}
const soloLectura=()=>estadoLic().solo;
const fechaLic=(off)=>day(off).toLocaleDateString(lang==="es"?"es-CO":"en-US",{day:"numeric",month:"long",year:"numeric"});
function chipLic(){
  const e=estadoLic(),L=t(); if(e.tipo==="licencia")return "";
  const rojo=e.tipo==="vencida"||e.quedan===1, amar=e.quedan<=7;
  const txt=e.tipo==="vencida"?L.lic_chip_venc:e.quedan===1?L.lic_chip_ultimo:L.lic_chip(e.quedan);
  return `<button class="licchip ${rojo?"rojo":amar?"amar":""}" data-abrir="licencia"><span>${e.tipo==="vencida"?"🔒":"🎁"}</span><span>${txt}</span><b>›</b></button>`;
}
function licInfoHtml(){
  const e=estadoLic(),L=t();
  const est=e.tipo==="licencia"?L.lic_est_lic:e.tipo==="vencida"?L.lic_est_venc:L.lic_est_prueba;
  const expl=e.tipo==="licencia"?L.lic_expl_lic:e.tipo==="vencida"?L.lic_expl_venc:L.lic_expl_prueba;
  const col=e.tipo==="licencia"?"var(--green)":e.tipo==="vencida"?"var(--red)":e.quedan<=7?"var(--yellow)":"var(--accent)";
  const usados=Math.min(DIAS_PRUEBA,simDia), act=-(simDia-1), fin=act+DIAS_PRUEBA-1;
  const filas=e.tipo==="licencia"
   ?`<div class="row"><div class="tx"><b>${L.lic_plan}</b></div><span>${L.lic_plan_lic}</span></div><div class="row"><div class="tx"><b>${L.lic_cliente}</b></div><span>${L.lic_cliente_v}</span></div>`
   :`<div class="row"><div class="tx"><b>${L.lic_plan}</b></div><span>${L.lic_plan_prueba}</span></div><div class="row"><div class="tx"><b>${L.lic_cliente}</b></div><span>${L.lic_cliente_v}</span></div><div class="row"><div class="tx"><b>${L.lic_activada}</b></div><span>${fechaLic(act)}</span></div><div class="row"><div class="tx"><b>${L.lic_vence}</b></div><span style="text-align:right">${fechaLic(fin)}<br><small style="color:var(--muted)">${L.lic_vence_h}</small></span></div>`;
  const barra=e.tipo==="licencia"?"":`<div class="bar"><i style="width:${Math.round(usados/DIAS_PRUEBA*100)}%;background:${col}"></i></div><small style="color:var(--muted)">${L.lic_dia(usados)}</small>`;
  const exp=e.tipo==="vencida"?`<button class="btn big ghost" id="licExp">${L.lic_exportar}</button>`:"";
  return `<div class="card" style="border-color:${col}"><div style="display:flex;align-items:center;gap:10px"><span style="font-size:26px">${e.tipo==="vencida"?"🔒":e.tipo==="licencia"?"✅":"🎁"}</span><b style="font-size:20px">${est}</b></div>${barra}<p style="color:var(--muted);font-size:14px;margin-top:10px">${esc(expl)}</p></div><div class="card" style="margin-top:10px;padding:4px 16px">${filas}</div>${exp}`;
}
function renderLic(){
  const L=t(); $("#licTitulo").textContent=L.lic_titulo;
  $("#licCuerpo").innerHTML=`<div id="licInfo">${licInfoHtml()}</div>
   <h2>${L.lic_codigo}</h2><input type="text" id="licCodigo" placeholder="${esc(L.lic_codigo_ph)}" autocomplete="off" autocapitalize="characters">
